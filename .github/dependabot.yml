version: 2
updates:
  - package-ecosystem: "npm"
    # Disable automatic PRs, including security updates; keep security alerts.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "gradle"
    # Disable automatic PRs, including security updates; keep security alerts.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
    directory: "/android"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    # Disable automatic PRs, including security updates; keep security alerts.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
    directory: "/"
    schedule:
      interval: "weekly"
