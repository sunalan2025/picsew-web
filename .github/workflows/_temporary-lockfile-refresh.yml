name: Temporary security lockfile regeneration

on:
  push:
    branches:
      - "security/targeted-dependency-upgrades-20261031"

permissions:
  contents: write

jobs:
  update-lock:
    if: "!contains(github.event.head_commit.message, '[lock-updated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update compatible dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh security lockfile [lock-updated]"
          git push origin HEAD:security/targeted-dependency-upgrades-20261031
