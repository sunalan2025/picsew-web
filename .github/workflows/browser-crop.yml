name: Browser crop smoke
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/browser-crop-smoke.mjs'
      - '.github/workflows/browser-crop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-crop-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node tests/browser-crop-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-crop-screenshots
          path: browser-crop-*.png
          if-no-files-found: ignore
