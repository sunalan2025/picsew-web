name: Dependency security audit

on:
  pull_request:
    paths:
      - ".github/workflows/dependency-audit.yml"
      - "scripts/audit-dependencies.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/dependabot.yml"
  workflow_dispatch:
  schedule:
    - cron: "11 5 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org --replace-registry-host=always
      - name: Audit dependencies (moderate or higher blocks the check)
        run: npm run audit:security -- --output-dir .audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-reports
          path: .audit/*.json
          if-no-files-found: ignore
