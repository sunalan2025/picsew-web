name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always

      - name: Validate and build
        run: npm run check

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published website revision
        timeout-minutes: 4
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          const expected = process.env.GITHUB_SHA;
          const site = new URL(process.env.SITE_URL);
          for (let attempt = 1; attempt <= 12; attempt++) {
            try {
              const infoUrl = new URL('build-info.json', site);
              const pageUrl = new URL(site);
              for (const url of [infoUrl, pageUrl]) url.searchParams.set('revision', expected);
              const options = () => ({ signal: AbortSignal.timeout(10000), headers: { 'Cache-Control': 'no-cache' } });
              const [info, page] = await Promise.all([fetch(infoUrl, options()), fetch(pageUrl, options())]);
              if (!info.ok || !page.ok) throw new Error(`HTTP ${info.status}/${page.status}`);
              const [build, html] = await Promise.all([info.json(), page.text()]);
              if (build.commit !== expected || !html.includes(`name="picsew-build" content="${expected}"`))
                throw new Error('Published content has not reached the requested revision yet');
              console.log(`Verified published homepage and build-info.json at ${site.href}: ${expected}`);
              process.exit(0);
            } catch (error) {
              console.log(`Website verification ${attempt}/12: ${error.message}`);
            }
            if (attempt < 12) await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          throw new Error('The published website revision could not be verified');
          NODE
